<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 张家读书打卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #FFF5EE 0%, #FFF0E8 50%, #FFE8E0 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card { background: white; border-radius: 24px; padding: 40px 28px; text-align: center; box-shadow: 0 8px 32px rgba(255,140,105,0.15); max-width: 380px; width: 100%; }
  .icon { font-size: 64px; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #FF8C69, #FF6B6B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: #8B7355; margin-bottom: 28px; }
  .btn { display: block; width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s; text-decoration: none; }
  .btn-primary { background: linear-gradient(135deg, #FF8C69, #FF6B6B); color: white; box-shadow: 0 6px 20px rgba(255,107,107,0.35); }
  .btn-primary:hover { transform: translateY(-2px); }
  .status { font-size: 13px; color: #6B9B6F; margin-top: 16px; padding: 10px; border-radius: 12px; background: #E8F5E9; }
</style>
</head>
<body>
<div class="card">
  <span class="icon">📚</span>
  <h1>张家每日读书打卡</h1>
  <p class="subtitle">👨‍👩‍👧‍👦 全家一起读，书香伴成长</p>
  <a class="btn btn-primary" href="reading-checkin.html">📖 进入读书打卡</a>
  <div class="status">✅ 永久在线，随时可用</div>
</div>
</body>
</html>
